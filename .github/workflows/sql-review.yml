name: MyBatis SQL Review

on:
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  sql-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python --version
          pip install -r ci/sql-review/requirements.txt

      - name: Detect changed files
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed_files.txt || true
          cat changed_files.txt

      - name: Extract changed SQL
        run: |
          python ci/sql-review/extract_changed_sql.py \
            --repo . \
            --changed-files $(tr '\n' ' ' < changed_files.txt) \
            --output changed_sql.json

      - name: Rule check
        run: |
          python ci/sql-review/rule_check.py \
            --input changed_sql.json \
            --rules ci/sql-review/rules/mysql_rules.yaml \
            --output sql-review.json

      - name: Render markdown report
        run: |
          python ci/sql-review/render_report.py \
            --input sql-review.json \
            --output gl-sql-review.md

      - name: Optional Qwen summary
        run: |
          python ci/sql-review/qwen_summary.py \
            --input sql-review.json \
            --prompt ci/sql-review/prompts/sql_review_summary_prompt.md \
            --output gl-sql-review-ai.md || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sql-review-artifacts
          path: |
            changed_sql.json
            sql-review.json
            gl-sql-review.md
            gl-sql-review-ai.md

      - name: Fail on block_merge
        run: |
          python -c "import json,sys; data=json.load(open('sql-review.json', encoding='utf-8')); sys.exit(1 if data.get('block_merge') else 0)"
